    <line x1="244" y1="126" x2="244" y2="214" stroke="#244136"/>
    <circle cx="244" cy="170" r="19" fill="none" stroke="#244136"/>
    <rect x="24" y="148" width="30" height="44" fill="none" stroke="#244136"/>
    <rect x="434" y="148" width="30" height="44" fill="none" stroke="#244136"/>
    <circle cx="244" cy="170" r="2.5" fill="#D97757"/>
    <text x="24" y="232" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="8" fill="#66786F" letter-spacing="1.4">CAM &#183; #11</text>
  </g>

  <g transform="translate(512 0)">
