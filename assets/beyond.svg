    <text x="24" y="34" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="8.5" fill="#63B3A0" letter-spacing="2.4">OFF THE CLOCK &#183; 02</text>
    <text x="24" y="68" font-family="'Inter','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="20" font-weight="700" fill="#F4F1EA" letter-spacing="-.2">Design</text>
    <text x="24" y="92" font-family="'Inter','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" fill="#97A69E">Dark, editorial, restrained.</text>
    <text x="24" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" fill="#97A69E">Consistency over decoration.</text>
    <text x="464" y="108" text-anchor="end" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="54" fill="#C8A96A" fill-opacity=".9">Aa</text>
