      <rect x="156" width="40" height="40" rx="9" fill="#C8A96A" fill-opacity=".9"/>
      <text x="20" y="58" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="7" fill="#66786F" letter-spacing=".8">FOREST</text>
      <text x="72" y="58" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="7" fill="#66786F" letter-spacing=".8">TERRA</text>
      <text x="124" y="58" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="7" fill="#66786F" letter-spacing=".8">TEAL</text>
