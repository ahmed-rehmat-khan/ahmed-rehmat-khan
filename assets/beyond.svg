<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <rect width="1000" height="240" fill="#06110D"/>
  <g transform="translate(0 0)">
    <rect x="1" y="1" width="486" height="238" rx="18" fill="#0A1B15" stroke="#244136"/>
    <line x1="1" y1="1" x2="49" y2="1" stroke="#D97757" stroke-width="2"/>
    <text x="24" y="34" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="8.5" fill="#D97757" letter-spacing="2.4">OFF THE CLOCK &#183; 01</text>
    <text x="24" y="68" font-family="'Inter','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="20" font-weight="700" fill="#F4F1EA" letter-spacing="-.2">Football</text>
    <text x="24" y="92" font-family="'Inter','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" fill="#97A69E">Attacking midfielder. Scan, find the space,</text>
    <text x="24" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" fill="#97A69E">make the pass.</text>
